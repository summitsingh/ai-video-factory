[project]
name = "ai-video-factory"
version = "0.1.0"
description = "Local AI video factory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.27,<0.28",
    "pydantic>=2.12,<3",
    "Pillow>=10",
]

[project.scripts]
ai-video-factory = "ai_video_factory.cli:app"

[project.optional-dependencies]
youtube = [
    "google-api-python-client>=2.0,<3",
    "google-auth-oauthlib>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_video_factory"]
